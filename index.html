<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CosmosDesk</title>

<link rel="icon" type="image/png" href="logo.png">

<style>
body {
  margin: 0;
  overflow: hidden;
  background: radial-gradient(circle at top, #050510, #000);
  font-family: "Segoe UI", Arial, sans-serif;
}

/* ===== HOME ===== */
#home {
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at center, #111, #000 70%);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: white;
  text-align: center;
  z-index: 1000;
}

#home img {
  width: 170px;
  margin-bottom: 25px;
  filter: drop-shadow(0 0 30px rgba(120,150,255,0.7));
}

#home h1 {
  font-size: 52px;
  letter-spacing: 2px;
}

#home p {
  max-width: 700px;
  font-size: 18px;
  opacity: 0.85;
  line-height: 1.6;
}

#enterBtn {
  margin-top: 35px;
  padding: 16px 44px;
  font-size: 20px;
  border: none;
  border-radius: 50px;
  cursor: pointer;
  background: linear-gradient(135deg, #fff, #dbe4ff);
  color: black;
}

/* ===== HUD ===== */
#topHUD {
  position: absolute;
  top: 14px;
  width: 100%;
  display: flex;
  justify-content: space-between;
  padding: 0 24px;
  color: white;
  z-index: 50;
  pointer-events: none;
}

#info {
  font-size: 14px;
  opacity: 0.85;
}

#bpmBox {
  background: rgba(0,0,0,0.55);
  padding: 8px 18px;
  border-radius: 22px;
  font-size: 14px;
  backdrop-filter: blur(6px);
}

/* ===== CONTROLS ===== */
#micBtn {
  position: fixed;
  bottom: 22px;
  right: 22px;
  padding: 12px 20px;
  font-size: 14px;
  border: none;
  border-radius: 25px;
  cursor: pointer;
  background: linear-gradient(135deg, #fff, #dbe4ff);
  color: black;
  z-index: 60;
}

/* ===== VIDEO ===== */
#video {
  position: absolute;
  bottom: 12px;
  left: 12px;
  width: 170px;
  height: 130px;
  opacity: 0.6;
  border-radius: 10px;
  transform: scaleX(-1);
  z-index: 40;
}

#canvas {
  width: 100vw;
  height: 100vh;
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>

<body>

<!-- HOME -->
<div id="home">
  <img src="logo.png" alt="CosmosDesk Logo">
  <h1>CosmosDesk</h1>
  <p>
    Interactive 3D particle system controlled by
    <b>hand gestures</b> and <b>music beats</b>.
  </p>
  <button id="enterBtn">ENTER COSMOS</button>
</div>

<!-- HUD -->
<div id="topHUD">
  <div id="info">
    ✋ Color | ✋✋ Size | ✊ Fist = Shape | 🎵 Beat = Shape
  </div>
  <div id="bpmBox">
    BPM: <span id="bpmValue">--</span>
  </div>
</div>

<button id="micBtn">🎤 Enable Mic</button>
<video id="video" playsinline></video>
<div id="canvas"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { FilesetResolver, HandLandmarker }
from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0";

/* ================= CONFIG ================= */
const COUNT = 14000;
const RADIUS = 22;
const SHAPES = ['sphere','torus','spiral','dna','wave','star'];

/* ================= STATE ================= */
let scene, camera, renderer, geometry;
let shapeIndex = 0;
let lastShapeSwitch = 0;

let target = new Float32Array(COUNT*3);
let vel = new Float32Array(COUNT*3);

let scale = 1, targetScale = 1;
let hue = 0.55, targetHue = 0.55;

/* ===== AUDIO ===== */
let audioCtx = null;
let analyser = null;
let audioData = null;
let micEnabled = false;

let lastBass = 0;
let beatStrength = 0;
let lastBeatTime = 0;
let bpm = 0;

/* ================= HOME ENTER ================= */
document.getElementById("enterBtn").onclick = () => {
  document.getElementById("home").style.display = "none";
  initThree();
  initVision();
};

/* ================= THREE ================= */
function initThree(){
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,1000);
  camera.position.z = 42;

  renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(innerWidth,innerHeight);
  document.getElementById("canvas").appendChild(renderer.domElement);

  new OrbitControls(camera,renderer.domElement).autoRotate = true;

  geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position",new THREE.BufferAttribute(new Float32Array(COUNT*3),3));
  geometry.setAttribute("color",new THREE.BufferAttribute(new Float32Array(COUNT*3),3));

  scene.add(new THREE.Points(
    geometry,
    new THREE.PointsMaterial({
      size:0.18,
      vertexColors:true,
      blending:THREE.AdditiveBlending,
      transparent:true
    })
  ));

  buildShape(SHAPES[shapeIndex],true);
  animate();
}

/* ================= SHAPES ================= */
function buildShape(type,instant=false){
  for(let i=0;i<COUNT;i++){
    const id=i*3;
    const t=Math.random()*Math.PI*2;
    let x=0,y=0,z=0;

    if(type==='sphere'){
      const p=Math.acos(2*Math.random()-1);
      x=RADIUS*Math.sin(p)*Math.cos(t);
      y=RADIUS*Math.sin(p)*Math.sin(t);
      z=RADIUS*Math.cos(p);
    }
    if(type==='torus'){
      const R=RADIUS*0.9,r=RADIUS*0.35,p=Math.random()*Math.PI*2;
      x=(R+r*Math.cos(p))*Math.cos(t);
      y=(R+r*Math.cos(p))*Math.sin(t);
      z=r*Math.sin(p);
    }
    if(type==='spiral'){
      const r=i/COUNT*RADIUS*1.3;
      x=Math.cos(t*6)*r;
      y=(Math.random()-0.5)*6;
      z=Math.sin(t*6)*r;
    }
    if(type==='dna'){
      const h=(i/COUNT-0.5)*RADIUS*2;
      x=Math.cos(t*2)*RADIUS*0.4;
      y=h;
      z=Math.sin(t*2)*RADIUS*0.4;
    }
    if(type==='wave'){
      const u=i/COUNT*RADIUS*2-RADIUS;
      x=u;
      y=Math.sin(u*0.4+t)*RADIUS*0.4;
      z=Math.cos(u*0.4+t)*RADIUS*0.4;
    }
    if(type==='star'){
      const r=i%2?RADIUS:RADIUS*0.5;
      x=Math.cos(t)*r;
      y=Math.sin(t)*r;
      z=(Math.random()-0.5)*5;
    }

    target[id]=x; target[id+1]=y; target[id+2]=z;
    if(instant){
      geometry.attributes.position.array[id]=x;
      geometry.attributes.position.array[id+1]=y;
      geometry.attributes.position.array[id+2]=z;
    }
  }
}

/* ================= SHAPE SWITCH (SHARED) ================= */
function switchShape(){
  const now = Date.now();
  if(now - lastShapeSwitch < 1200) return; // debounce
  shapeIndex = (shapeIndex + 1) % SHAPES.length;
  buildShape(SHAPES[shapeIndex]);
  lastShapeSwitch = now;
}

/* ================= MIC ================= */
document.getElementById("micBtn").onclick = async () => {
  if(micEnabled) return;
  audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  await audioCtx.resume();
  const stream = await navigator.mediaDevices.getUserMedia({audio:true});
  const src = audioCtx.createMediaStreamSource(stream);
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 512;
  audioData = new Uint8Array(analyser.frequencyBinCount);
  src.connect(analyser);
  micEnabled = true;
  document.getElementById("micBtn").innerText = "🎵 Mic Active";
};

/* ================= ANIMATE ================= */
function animate(){
  requestAnimationFrame(animate);

  if(analyser){
    analyser.getByteFrequencyData(audioData);

    let bass=0;
    const bins=Math.floor(audioData.length*0.15);
    for(let i=0;i<bins;i++) bass+=audioData[i];
    bass=bass/bins/255;

    if(bass>0.1 && bass>lastBass*1.5){
      const now=performance.now();
      const interval=now-lastBeatTime;
      if(interval>350){
        const detected=Math.round(60000/interval);
        if(detected>=60 && detected<=180){
          bpm=detected;
          document.getElementById("bpmValue").innerText=bpm;
        }
        lastBeatTime=now;
        beatStrength=1.0;

        // 🔥 MUSIC BEAT SHAPE CHANGE
        if(Math.random()>0.6) switchShape();
      }
    }
    lastBass=bass;
  }

  beatStrength*=0.88;

  scale+=((targetScale+beatStrength*1.6)-scale)*0.12;
  hue+=((targetHue+beatStrength*0.7)-hue)*0.15;

  const pos=geometry.attributes.position.array;
  const col=geometry.attributes.color.array;
  const color=new THREE.Color().setHSL(hue%1,0.85,0.55);

  for(let i=0;i<COUNT;i++){
    const id=i*3;
    vel[id]+=(target[id]*scale-pos[id])*0.002;
    vel[id+1]+=(target[id+1]*scale-pos[id+1])*0.002;
    vel[id+2]+=(target[id+2]*scale-pos[id+2])*0.002;
    vel[id]*=0.9; vel[id+1]*=0.9; vel[id+2]*=0.9;
    pos[id]+=vel[id]; pos[id+1]+=vel[id+1]; pos[id+2]+=vel[id+2];
    col[id]=color.r; col[id+1]=color.g; col[id+2]=color.b;
  }

  geometry.attributes.position.needsUpdate=true;
  geometry.attributes.color.needsUpdate=true;
  renderer.render(scene,camera);
}

/* ================= HAND TRACKING ================= */
async function initVision(){
  const video=document.getElementById("video");
  const vision=await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/wasm"
  );
  const lm=await HandLandmarker.createFromOptions(vision,{
    baseOptions:{modelAssetPath:
      "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"},
    runningMode:"VIDEO",numHands:2
  });

  const stream=await navigator.mediaDevices.getUserMedia({video:true});
  video.srcObject=stream;
  await video.play();

  const loop=()=>{
    const r=lm.detectForVideo(video,performance.now());
    if(r.landmarks?.length){
      if(r.landmarks.length===2){
        const a=r.landmarks[0][9],b=r.landmarks[1][9];
        targetScale=1+Math.hypot(a.x-b.x,a.y-b.y)*2;
      } else targetScale=1;

      targetHue=1-r.landmarks[0][9].x;

      // ✊ FIST → SHAPE CHANGE (FIXED)
      const h=r.landmarks[0];
      const tips=[8,12,16,20];
      const kn=[5,9,13,17];
      let folded=0;
      for(let i=0;i<4;i++){
        if(h[tips[i]].y > h[kn[i]].y) folded++;
      }
      if(folded>=3) switchShape();
    }
    requestAnimationFrame(loop);
  };
  loop();
}
</script>
</body>
</html>
